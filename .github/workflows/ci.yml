name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build userscript
        run: npm run build

      - name: Validate metadata
        run: npm run check:metadata

      - name: Verify committed artifact
        run: git diff --exit-code -- dist/rocket-chat-markdown-plus.user.js

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Browser tests
        run: npm run test:e2e
