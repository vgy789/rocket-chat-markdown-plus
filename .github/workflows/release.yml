name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "Tag ${RELEASE_TAG} must use the vX.Y.Z format." >&2
            exit 1
          }

      - name: Test and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run check:metadata

      - name: Prepare release assets
        run: |
          cp dist/rocket-chat-markdown-plus.user.js rocket-chat-markdown-plus.user.js
          sha256sum rocket-chat-markdown-plus.user.js > rocket-chat-markdown-plus.user.js.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            rocket-chat-markdown-plus.user.js
            rocket-chat-markdown-plus.user.js.sha256
